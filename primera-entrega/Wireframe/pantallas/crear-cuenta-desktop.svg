<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1294" viewBox="0 0 1440 1294" role="img" aria-labelledby="title desc"><title id="title">Crear cuenta</title><desc id="desc">Mockup digital vectorial de Laure Joyas. Versión escritorio de 1440 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="1440" height="1294" fill="#0b0f12"/><rect x="0" y="0" width="1440" height="44" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><text x="32" y="27" font-family="Montserrat" font-size="13" font-weight="600" fill="#b0bac5" text-anchor="start">MOCKUP DIGITAL  /  CREAR CUENTA</text><text x="64" y="99" font-family="Liberation Serif" font-size="30" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="614" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Inicio</text><text x="740" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Catálogo</text><text x="866" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Cotizador</text><text x="992" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Contacto</text><text x="1118" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Carrito (2)</text><text x="1244" y="97" font-family="Montserrat" font-size="15" font-weight="600" fill="#f5d77f" text-anchor="start">Acceso</text><line x1="1244" y1="109" x2="1334" y2="109" stroke="#f5d77f" stroke-width="2"/><line x1="0" y1="132" x2="1440" y2="132" stroke="#354657" stroke-width="1"/><text x="96" y="192" font-family="Liberation Serif" font-size="38" font-weight="700" fill="#f5d77f" text-anchor="start">Creá tu cuenta</text><text x="96" y="230" font-family="Montserrat" font-size="17" font-weight="400" fill="#b0bac5" text-anchor="start">Registrate para iniciar sesión en esta demostración académica.</text><rect x="392" y="280" width="656" height="790" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="416" y="324" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Nombre completo</text><rect x="416" y="337" width="608" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="430" y="367" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">Ej: Ana García</text><text x="416" y="407" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">2–60 caracteres: letras, espacios, guion o apóstrofo.</text><text x="416" y="451" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Correo electrónico</text><rect x="416" y="464" width="608" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="430" y="494" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">ejemplo@correo.com</text><text x="416" y="534" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Máximo 80 caracteres.</text><text x="416" y="578" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Contraseña</text><rect x="416" y="591" width="608" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="430" y="621" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">••••••••</text><text x="416" y="661" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Entre 8 y 128 caracteres. Usá una clave de prueba.</text><text x="416" y="705" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Confirmá la contraseña</text><rect x="416" y="718" width="608" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="430" y="748" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">••••••••</text><text x="416" y="788" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Ingresá nuevamente la misma contraseña.</text><rect x="416" y="832" width="608" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="720.0" y="861.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#12181f" text-anchor="middle">Creá tu cuenta</text><text x="416" y="915" font-family="Montserrat" font-size="14" font-weight="400" fill="#f5d77f" text-anchor="start">¿Ya tenés cuenta? Iniciá sesión</text><text x="416" y="959" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Cuenta de demostración almacenada en este navegador. No uses datos sensibles ni una</text><text x="416" y="979" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">clave de otro servicio.</text><rect x="0" y="1124" width="1440" height="170" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><line x1="0" y1="1124" x2="1440" y2="1124" stroke="#354657" stroke-width="1"/><text x="96" y="1167" font-family="Liberation Serif" font-size="22" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="96" y="1200" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Obispo Trejo 323 · Córdoba, Argentina</text><text x="96" y="1227" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Proyecto académico · Taller de Desarrollo Web · UCC 2026</text><text x="96" y="1254" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Pedro Gatti · Joaquin Mármol</text></svg>