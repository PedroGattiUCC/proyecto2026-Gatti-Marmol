<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1438" viewBox="0 0 390 1438" role="img" aria-labelledby="title desc"><title id="title">Crear cuenta</title><desc id="desc">Mockup digital vectorial de Laure Joyas. Versión móvil de 390 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="390" height="1438" fill="#0b0f12"/><rect x="0" y="0" width="390" height="44" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><text x="16" y="27" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">MOCKUP DIGITAL  /  CREAR CUENTA</text><text x="24" y="85" font-family="Liberation Serif" font-size="25" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="27" y="125" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Inicio</text><text x="141" y="125" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Catálogo</text><text x="255" y="125" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Cotizador</text><text x="27" y="164" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Contacto</text><text x="141" y="164" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Carrito (2)</text><text x="255" y="164" font-family="Montserrat" font-size="13" font-weight="600" fill="#f5d77f" text-anchor="start">Acceso</text><line x1="252" y1="174" x2="342" y2="174" stroke="#f5d77f" stroke-width="2"/><line x1="0" y1="190" x2="390" y2="190" stroke="#354657" stroke-width="1"/><text x="24" y="234" font-family="Montserrat" font-size="27" font-weight="600" fill="#f5d77f" text-anchor="start">Creá tu cuenta</text><text x="24" y="274" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Registrate para iniciar sesión en esta</text><text x="24" y="297" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">demostración académica.</text><rect x="24" y="344" width="342" height="807" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="48" y="388" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="start">Nombre completo</text><rect x="48" y="401" width="294" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="62" y="431" font-family="Montserrat" font-size="14" font-weight="400" fill="#b0bac5" text-anchor="start">Ej: Ana García</text><text x="48" y="471" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">2–60 caracteres: letras, espacios, guion o</text><text x="48" y="490" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">apóstrofo.</text><text x="48" y="534" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="start">Correo electrónico</text><rect x="48" y="547" width="294" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="62" y="577" font-family="Montserrat" font-size="14" font-weight="400" fill="#b0bac5" text-anchor="start">ejemplo@correo.com</text><text x="48" y="617" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Máximo 80 caracteres.</text><text x="48" y="661" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="start">Contraseña</text><rect x="48" y="674" width="294" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="62" y="704" font-family="Montserrat" font-size="14" font-weight="400" fill="#b0bac5" text-anchor="start">••••••••</text><text x="48" y="744" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Entre 8 y 128 caracteres. Usá una clave de</text><text x="48" y="763" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">prueba.</text><text x="48" y="807" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="start">Confirmá la contraseña</text><rect x="48" y="820" width="294" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="62" y="850" font-family="Montserrat" font-size="14" font-weight="400" fill="#b0bac5" text-anchor="start">••••••••</text><text x="48" y="890" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Ingresá nuevamente la misma contraseña.</text><rect x="48" y="934" width="294" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="195.0" y="963.0" font-family="Montserrat" font-size="14" font-weight="600" fill="#12181f" text-anchor="middle">Creá tu cuenta</text><text x="48" y="1017" font-family="Montserrat" font-size="14" font-weight="400" fill="#f5d77f" text-anchor="start">¿Ya tenés cuenta? Iniciá sesión</text><text x="48" y="1061" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Cuenta de demostración almacenada en</text><text x="48" y="1081" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">este navegador. No uses datos sensibles ni</text><text x="48" y="1101" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">una clave de otro servicio.</text><rect x="0" y="1205" width="390" height="233" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><line x1="0" y1="1205" x2="390" y2="1205" stroke="#354657" stroke-width="1"/><text x="24" y="1248" font-family="Liberation Serif" font-size="22" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="24" y="1281" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Obispo Trejo 323 · Córdoba, Argentina</text><text x="24" y="1308" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Proyecto académico · Taller de Desarrollo Web · UCC</text><text x="24" y="1327" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">2026</text><text x="24" y="1354" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Pedro Gatti · Joaquin Mármol</text></svg>