<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1912" viewBox="0 0 1440 1912" role="img" aria-labelledby="title desc"><title id="title">Estados y validación</title><desc id="desc">Mockup digital vectorial de Laure Joyas. Versión escritorio de 1440 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="1440" height="1912" fill="#0b0f12"/><rect x="0" y="0" width="1440" height="44" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><text x="32" y="27" font-family="Montserrat" font-size="13" font-weight="600" fill="#b0bac5" text-anchor="start">MOCKUP DIGITAL  /  ESTADOS Y VALIDACIÓN</text><text x="64" y="99" font-family="Liberation Serif" font-size="30" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="614" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Inicio</text><text x="740" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Catálogo</text><text x="866" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Cotizador</text><text x="992" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Contacto</text><text x="1118" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Carrito (2)</text><text x="1244" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Acceso</text><line x1="0" y1="132" x2="1440" y2="132" stroke="#354657" stroke-width="1"/><text x="96" y="192" font-family="Liberation Serif" font-size="38" font-weight="700" fill="#f5d77f" text-anchor="start">Estados y validación</text><text x="96" y="230" font-family="Montserrat" font-size="17" font-weight="400" fill="#b0bac5" text-anchor="start">Variantes de las pantallas. Los mensajes se acompañan de texto y acciones claras.</text><rect x="96.0" y="280" width="400.0" height="401" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="116.0" y="310" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">01 · COTIZADOR</text><text x="116.0" y="348" font-family="Montserrat" font-size="18" font-weight="600" fill="#f5d77f" text-anchor="start">Peso fuera de rango</text><text x="116.0" y="391" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Peso aproximado (gramos)</text><rect x="116.0" y="404" width="360.0" height="48" rx="6" fill="#0b0f12" stroke="#ffb1ac" stroke-width="1"/><text x="130.0" y="434" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">Ingresá un peso válido</text><rect x="116.0" y="471" width="360.0" height="99" rx="6" fill="#352226" stroke="#ffb1ac" stroke-width="1"/><text x="128.0" y="495" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffb1ac" text-anchor="start">Error</text><text x="128.0" y="519" font-family="Montserrat" font-size="12" font-weight="400" fill="#ffb1ac" text-anchor="start">Ingresá un peso entre 1 y 500 gramos.</text><text x="116.0" y="593" font-family="Montserrat" font-size="11" font-weight="400" fill="#b0bac5" text-anchor="start">Alert: campo vacío y foco en peso.</text><rect x="116.0" y="627" width="360.0" height="40" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="296.0" y="652.0" font-family="Montserrat" font-size="13" font-weight="600" fill="#12181f" text-anchor="middle">Aceptar</text><rect x="520.0" y="280" width="400.0" height="401" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="540.0" y="310" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">02 · COTIZADOR</text><text x="540.0" y="348" font-family="Montserrat" font-size="18" font-weight="600" fill="#f5d77f" text-anchor="start">Gemas inválidas</text><text x="540.0" y="391" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Cantidad de gemas</text><rect x="540.0" y="404" width="360.0" height="48" rx="6" fill="#0b0f12" stroke="#ffb1ac" stroke-width="1"/><text x="554.0" y="434" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">Ingresá una cantidad entera</text><rect x="540.0" y="471" width="360.0" height="99" rx="6" fill="#352226" stroke="#ffb1ac" stroke-width="1"/><text x="552.0" y="495" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffb1ac" text-anchor="start">Error</text><text x="552.0" y="519" font-family="Montserrat" font-size="12" font-weight="400" fill="#ffb1ac" text-anchor="start">La cantidad de gemas debe ser un número entero</text><text x="552.0" y="537" font-family="Montserrat" font-size="12" font-weight="400" fill="#ffb1ac" text-anchor="start">entre 0 y 30.</text><text x="540.0" y="593" font-family="Montserrat" font-size="11" font-weight="400" fill="#b0bac5" text-anchor="start">Alert: campo vacío y foco en gemas.</text><rect x="540.0" y="627" width="360.0" height="40" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="720.0" y="652.0" font-family="Montserrat" font-size="13" font-weight="600" fill="#12181f" text-anchor="middle">Aceptar</text><rect x="944.0" y="280" width="400.0" height="401" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="964.0" y="310" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">03 · CARRITO</text><text x="964.0" y="348" font-family="Montserrat" font-size="18" font-weight="600" fill="#f5d77f" text-anchor="start">Cupón inválido</text><text x="964.0" y="391" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">¿Tenés un cupón?</text><rect x="964.0" y="404" width="360.0" height="48" rx="6" fill="#0b0f12" stroke="#ffb1ac" stroke-width="1"/><text x="978.0" y="434" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">Probá: LAURE10</text><rect x="964.0" y="471" width="360.0" height="99" rx="6" fill="#352226" stroke="#ffb1ac" stroke-width="1"/><text x="976.0" y="495" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffb1ac" text-anchor="start">Error</text><text x="976.0" y="519" font-family="Montserrat" font-size="12" font-weight="400" fill="#ffb1ac" text-anchor="start">El cupón ingresado no es válido o ha expirado.</text><text x="964.0" y="593" font-family="Montserrat" font-size="11" font-weight="400" fill="#b0bac5" text-anchor="start">Campo vacío, foco y total sin descuento.</text><rect x="964.0" y="627" width="360.0" height="40" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="1144.0" y="652.0" font-family="Montserrat" font-size="13" font-weight="600" fill="#12181f" text-anchor="middle">Aplicá</text><rect x="96.0" y="705" width="400.0" height="401" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="116.0" y="735" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">04 · ACCESO</text><text x="116.0" y="773" font-family="Montserrat" font-size="18" font-weight="600" fill="#f5d77f" text-anchor="start">Datos inválidos</text><text x="116.0" y="816" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Correo electrónico</text><rect x="116.0" y="829" width="360.0" height="48" rx="6" fill="#0b0f12" stroke="#ffb1ac" stroke-width="1"/><text x="130.0" y="859" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">ejemplo@correo.com</text><rect x="116.0" y="896" width="360.0" height="99" rx="6" fill="#352226" stroke="#ffb1ac" stroke-width="1"/><text x="128.0" y="920" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffb1ac" text-anchor="start">Error</text><text x="128.0" y="944" font-family="Montserrat" font-size="12" font-weight="400" fill="#ffb1ac" text-anchor="start">Ingresá un correo válido o revisá las credenciales de tu</text><text x="128.0" y="962" font-family="Montserrat" font-size="12" font-weight="400" fill="#ffb1ac" text-anchor="start">cuenta.</text><text x="116.0" y="1018" font-family="Montserrat" font-size="11" font-weight="400" fill="#b0bac5" text-anchor="start">Panel de error + alert. Corregí el campo.</text><rect x="116.0" y="1052" width="360.0" height="40" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="296.0" y="1077.0" font-family="Montserrat" font-size="13" font-weight="600" fill="#12181f" text-anchor="middle">Iniciá Sesión</text><rect x="520.0" y="705" width="400.0" height="401" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="540.0" y="735" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">05 · CREAR CUENTA</text><text x="540.0" y="773" font-family="Montserrat" font-size="18" font-weight="600" fill="#f5d77f" text-anchor="start">Contraseñas diferentes</text><text x="540.0" y="816" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Confirmá la contraseña</text><rect x="540.0" y="829" width="360.0" height="48" rx="6" fill="#0b0f12" stroke="#ffb1ac" stroke-width="1"/><text x="554.0" y="859" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">Repetí tu contraseña</text><rect x="540.0" y="896" width="360.0" height="99" rx="6" fill="#352226" stroke="#ffb1ac" stroke-width="1"/><text x="552.0" y="920" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffb1ac" text-anchor="start">Error</text><text x="552.0" y="944" font-family="Montserrat" font-size="12" font-weight="400" fill="#ffb1ac" text-anchor="start">Las contraseñas no coinciden. Volvé a ingresarla.</text><text x="540.0" y="1018" font-family="Montserrat" font-size="11" font-weight="400" fill="#b0bac5" text-anchor="start">Panel de error + alert. Foco en confirmación.</text><rect x="540.0" y="1052" width="360.0" height="40" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="720.0" y="1077.0" font-family="Montserrat" font-size="13" font-weight="600" fill="#12181f" text-anchor="middle">Creá tu cuenta</text><rect x="944.0" y="705" width="400.0" height="401" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="964.0" y="735" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">06 · CREAR CUENTA</text><text x="964.0" y="773" font-family="Montserrat" font-size="18" font-weight="600" fill="#f5d77f" text-anchor="start">Correo ya registrado</text><text x="964.0" y="816" font-family="Montserrat" font-size="16" font-weight="600" fill="#edf0f3" text-anchor="start">Correo electrónico</text><rect x="964.0" y="829" width="360.0" height="48" rx="6" fill="#0b0f12" stroke="#ffb1ac" stroke-width="1"/><text x="978.0" y="859" font-family="Montserrat" font-size="16" font-weight="400" fill="#b0bac5" text-anchor="start">ejemplo@correo.com</text><rect x="964.0" y="896" width="360.0" height="99" rx="6" fill="#352226" stroke="#ffb1ac" stroke-width="1"/><text x="976.0" y="920" font-family="Montserrat" font-size="12" font-weight="700" fill="#ffb1ac" text-anchor="start">Error</text><text x="976.0" y="944" font-family="Montserrat" font-size="12" font-weight="400" fill="#ffb1ac" text-anchor="start">Este correo ya tiene una cuenta en este navegador.</text><text x="964.0" y="1018" font-family="Montserrat" font-size="11" font-weight="400" fill="#b0bac5" text-anchor="start">Revisá el correo o iniciá sesión.</text><rect x="964.0" y="1052" width="360.0" height="40" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="1144.0" y="1077.0" font-family="Montserrat" font-size="13" font-weight="600" fill="#12181f" text-anchor="middle">Ir a Acceso</text><rect x="96.0" y="1158" width="612.0" height="241" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="116.0" y="1187" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">07 · CARRITO VACÍO</text><text x="116.0" y="1225" font-family="Montserrat" font-size="19" font-weight="600" fill="#f5d77f" text-anchor="start">Tu carrito está vacío</text><text x="116.0" y="1260" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Agregá productos desde el catálogo antes de confirmar una compra o aplicar un cupón.</text><rect x="116.0" y="1332" width="572.0" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="402.0" y="1361.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#12181f" text-anchor="middle">Explorá el Catálogo</text><rect x="732.0" y="1158" width="612.0" height="241" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="752.0" y="1187" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">08 · CONFIRMAR VACIADO</text><text x="752.0" y="1225" font-family="Montserrat" font-size="19" font-weight="600" fill="#f5d77f" text-anchor="start">¿Querés vaciar tu carrito?</text><text x="752.0" y="1260" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Se quitarán todos los artículos del carrito. Elegí Cancelar para conservarlos.</text><rect x="752.0" y="1332" width="280.0" height="48" rx="6" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="892.0" y="1361.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#edf0f3" text-anchor="middle">Cancelar</text><rect x="1044.0" y="1332" width="280.0" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="1184.0" y="1361.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#12181f" text-anchor="middle">Aceptar</text><rect x="96.0" y="1423" width="612.0" height="241" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="116.0" y="1452" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">09 · CUENTA CREADA</text><text x="116.0" y="1490" font-family="Montserrat" font-size="19" font-weight="600" fill="#f5d77f" text-anchor="start">Tu cuenta fue creada</text><text x="116.0" y="1525" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Registro local completado. Ahora podés iniciar sesión con el correo y la contraseña</text><text x="116.0" y="1546" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">elegidos.</text><rect x="116.0" y="1597" width="572.0" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="402.0" y="1626.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#12181f" text-anchor="middle">Ir a Acceso</text><rect x="732.0" y="1423" width="612.0" height="241" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="752.0" y="1452" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">10 · SESIÓN ACTIVA</text><text x="752.0" y="1490" font-family="Montserrat" font-size="19" font-weight="600" fill="#f5d77f" text-anchor="start">Hola, Ana</text><text x="752.0" y="1525" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Ana García · ana@ejemplo.com. La sesión de demostración está activa en este</text><text x="752.0" y="1546" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">navegador.</text><rect x="752.0" y="1597" width="572.0" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="1038.0" y="1626.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#12181f" text-anchor="middle">Salir</text><rect x="0" y="1742" width="1440" height="170" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><line x1="0" y1="1742" x2="1440" y2="1742" stroke="#354657" stroke-width="1"/><text x="96" y="1785" font-family="Liberation Serif" font-size="22" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="96" y="1818" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Obispo Trejo 323 · Córdoba, Argentina</text><text x="96" y="1845" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Proyecto académico · Taller de Desarrollo Web · UCC 2026</text><text x="96" y="1872" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Pedro Gatti · Joaquin Mármol</text></svg>