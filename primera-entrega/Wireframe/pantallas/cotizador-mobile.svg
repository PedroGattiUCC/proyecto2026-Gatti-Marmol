<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2342" viewBox="0 0 390 2342" role="img" aria-labelledby="title desc"><title id="title">Cotizador</title><desc id="desc">Mockup digital vectorial de Laure Joyas. Versión móvil de 390 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="390" height="2342" fill="#0b0f12"/><rect x="0" y="0" width="390" height="44" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><text x="16" y="27" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">MOCKUP DIGITAL  /  COTIZADOR</text><text x="24" y="85" font-family="Liberation Serif" font-size="25" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="27" y="125" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Inicio</text><text x="141" y="125" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Catálogo</text><text x="255" y="125" font-family="Montserrat" font-size="13" font-weight="600" fill="#f5d77f" text-anchor="start">Cotizador</text><line x1="252" y1="135" x2="342" y2="135" stroke="#f5d77f" stroke-width="2"/><text x="27" y="164" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Contacto</text><text x="141" y="164" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Carrito (2)</text><text x="255" y="164" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Acceso</text><line x1="0" y1="190" x2="390" y2="190" stroke="#354657" stroke-width="1"/><text x="24" y="234" font-family="Montserrat" font-size="27" font-weight="600" fill="#f5d77f" text-anchor="start">Cotizador interactivo de</text><text x="24" y="269" font-family="Montserrat" font-size="27" font-weight="600" fill="#f5d77f" text-anchor="start">joyas</text><text x="24" y="309" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Calculá un presupuesto estimativo según los</text><text x="24" y="332" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">materiales de tu pieza.</text><rect x="24" y="371" width="342" height="686" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="44" y="405" font-family="Montserrat" font-size="22" font-weight="600" fill="#f5d77f" text-anchor="start">Personalizá tu pieza</text><text x="44" y="445" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="start">Metal precioso</text><rect x="44" y="458" width="302" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="58" y="488" font-family="Montserrat" font-size="14" font-weight="400" fill="#b0bac5" text-anchor="start">Oro 18k ($ 95.000/g)</text><text x="324" y="487" font-family="Montserrat" font-size="18" font-weight="400" fill="#f5d77f" text-anchor="middle">⌄</text><text x="44" y="531" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="start">Peso aproximado (gramos)</text><rect x="44" y="544" width="302" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="58" y="574" font-family="Montserrat" font-size="14" font-weight="400" fill="#b0bac5" text-anchor="start">10</text><text x="44" y="614" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Entre 1 y 500 gramos.</text><text x="44" y="658" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="start">Cantidad de gemas</text><rect x="44" y="671" width="302" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="58" y="701" font-family="Montserrat" font-size="14" font-weight="400" fill="#b0bac5" text-anchor="start">2</text><text x="44" y="741" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Número entero entre 0 y 30.</text><text x="44" y="785" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="start">Grabado personalizado (opcional)</text><rect x="44" y="798" width="302" height="48" rx="6" fill="#0b0f12" stroke="#354657" stroke-width="1"/><text x="58" y="828" font-family="Montserrat" font-size="14" font-weight="400" fill="#b0bac5" text-anchor="start">Laure 2026</text><text x="44" y="868" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Máximo 25 caracteres.</text><rect x="44" y="912" width="302" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="195.0" y="941.0" font-family="Montserrat" font-size="14" font-weight="600" fill="#12181f" text-anchor="middle">Calculá tu Presupuesto</text><rect x="44" y="972" width="302" height="48" rx="6" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="195.0" y="1001.0" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="middle">Restablecé</text><rect x="24" y="1089" width="342" height="375" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="48" y="1128" font-family="Montserrat" font-size="21" font-weight="600" fill="#f5d77f" text-anchor="start">Presupuesto estimativo</text><text x="48" y="1173" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Oro 18k · 10 g</text><text x="342" y="1173" font-family="Montserrat" font-size="13" font-weight="400" fill="#edf0f3" text-anchor="end">$ 950.000</text><text x="48" y="1221" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">2 gemas engarzadas</text><text x="342" y="1221" font-family="Montserrat" font-size="13" font-weight="400" fill="#edf0f3" text-anchor="end">$ 50.000</text><text x="48" y="1269" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Grabado: Laure 2026</text><text x="342" y="1269" font-family="Montserrat" font-size="13" font-weight="400" fill="#edf0f3" text-anchor="end">$ 5.000</text><line x1="48" y1="1300" x2="342" y2="1300" stroke="#354657" stroke-width="1"/><text x="48" y="1329" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">TOTAL ESTIMADO · ARS</text><text x="48" y="1368" font-family="Montserrat" font-size="31" font-weight="600" fill="#f5d77f" text-anchor="start">$ 1.005.000</text><rect x="48" y="1393" width="294" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="195.0" y="1422.0" font-family="Montserrat" font-size="14" font-weight="600" fill="#12181f" text-anchor="middle">Agregá tu Joya al Carrito</text><text x="24" y="1492" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Estimación de referencia. El importe depende del</text><text x="24" y="1512" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">metal, peso, gemas y grabado elegidos.</text><text x="24" y="1609" font-family="Montserrat" font-size="27" font-weight="600" fill="#f5d77f" text-anchor="start">Tarifas de referencia</text><text x="24" y="1668" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Valores por gramo de metal precioso · ARS</text><rect x="24" y="1704" width="342" height="105" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="40" y="1731" font-family="Montserrat" font-size="16" font-weight="600" fill="#f5d77f" text-anchor="start">Oro 18k</text><text x="40" y="1755" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">750 · Pulido / satinado</text><text x="40" y="1785" font-family="Montserrat" font-size="17" font-weight="600" fill="#edf0f3" text-anchor="start">$ 95.000 / g</text><rect x="24" y="1821" width="342" height="105" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="40" y="1848" font-family="Montserrat" font-size="16" font-weight="600" fill="#f5d77f" text-anchor="start">Plata 925</text><text x="40" y="1872" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">925 · Envejecido / rodinado</text><text x="40" y="1902" font-family="Montserrat" font-size="17" font-weight="600" fill="#edf0f3" text-anchor="start">$ 12.000 / g</text><rect x="24" y="1938" width="342" height="105" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="40" y="1965" font-family="Montserrat" font-size="16" font-weight="600" fill="#f5d77f" text-anchor="start">Platino 950</text><text x="40" y="1989" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">950 · Brillo de alta durabilidad</text><text x="40" y="2019" font-family="Montserrat" font-size="17" font-weight="600" fill="#edf0f3" text-anchor="start">$ 110.000 / g</text><rect x="0" y="2109" width="390" height="233" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><line x1="0" y1="2109" x2="390" y2="2109" stroke="#354657" stroke-width="1"/><text x="24" y="2152" font-family="Liberation Serif" font-size="22" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="24" y="2185" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Obispo Trejo 323 · Córdoba, Argentina</text><text x="24" y="2212" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Proyecto académico · Taller de Desarrollo Web · UCC</text><text x="24" y="2231" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">2026</text><text x="24" y="2258" font-family="Montserrat" font-size="12" font-weight="400" fill="#b0bac5" text-anchor="start">Pedro Gatti · Joaquin Mármol</text></svg>