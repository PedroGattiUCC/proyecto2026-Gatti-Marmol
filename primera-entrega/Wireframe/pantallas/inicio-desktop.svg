<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1913" viewBox="0 0 1440 1913" role="img" aria-labelledby="title desc"><title id="title">Inicio</title><desc id="desc">Mockup digital vectorial de Laure Joyas. Versión escritorio de 1440 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="1440" height="1913" fill="#0b0f12"/><rect x="0" y="0" width="1440" height="44" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><text x="32" y="27" font-family="Montserrat" font-size="13" font-weight="600" fill="#b0bac5" text-anchor="start">MOCKUP DIGITAL  /  INICIO</text><text x="64" y="99" font-family="Liberation Serif" font-size="30" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="614" y="97" font-family="Montserrat" font-size="15" font-weight="600" fill="#f5d77f" text-anchor="start">Inicio</text><line x1="614" y1="109" x2="704" y2="109" stroke="#f5d77f" stroke-width="2"/><text x="740" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Catálogo</text><text x="866" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Cotizador</text><text x="992" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Contacto</text><text x="1118" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Carrito (2)</text><text x="1244" y="97" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Acceso</text><line x1="0" y1="132" x2="1440" y2="132" stroke="#354657" stroke-width="1"/><rect x="96" y="180" width="1248" height="390" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="132" y="226" font-family="Montserrat" font-size="13" font-weight="600" fill="#b0bac5" text-anchor="start">ALTA JOYERÍA · ORFEBRERÍA FINA</text><text x="132" y="295" font-family="Liberation Serif" font-size="48" font-weight="700" fill="#f5d77f" text-anchor="start">Piezas eternas</text><text x="132" y="352" font-family="Liberation Serif" font-size="48" font-weight="700" fill="#f5d77f" text-anchor="start">forjadas a mano</text><text x="132" y="400" font-family="Montserrat" font-size="17" font-weight="400" fill="#b0bac5" text-anchor="start">Arte orfebre tradicional y gemas de pureza inigualable. Cada</text><text x="132" y="426" font-family="Montserrat" font-size="17" font-weight="400" fill="#b0bac5" text-anchor="start">joya cuenta una historia única.</text><rect x="132" y="490" width="245" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="254.5" y="519.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#12181f" text-anchor="middle">Explorá el Catálogo</text><rect x="391" y="490" width="245" height="48" rx="6" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="513.5" y="519.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#edf0f3" text-anchor="middle">Cotizá a Medida</text><rect x="762" y="181" width="581" height="388" rx="0" fill="#10171d" stroke="none" stroke-width="1"/><g transform="translate(1052.5,375.0) scale(1.6166666666666667)" fill="none" stroke="#f5d77f" stroke-width="3"><ellipse cx="0" cy="20" rx="57" ry="64"/><ellipse cx="0" cy="20" rx="46" ry="55" stroke-width="1"/><path d="M-30,-40 L-18,-58 L18,-58 L30,-40 L0,-8Z" fill="#e8edf1" stroke="#e8edf1"/><path d="M-30,-40 L30,-40 M-18,-58 L0,-8 L18,-58 M-10,-40 L0,-58 L10,-40" stroke="#6c8393" stroke-width="1"/></g><text x="778" y="554" font-family="Montserrat" font-size="11" font-weight="400" fill="#b0bac5" text-anchor="start">Colección de anillos y colgantes</text><text x="96" y="644" font-family="Liberation Serif" font-size="38" font-weight="700" fill="#f5d77f" text-anchor="start">Obras maestras destacadas</text><text x="96" y="682" font-family="Montserrat" font-size="17" font-weight="400" fill="#b0bac5" text-anchor="start">Una selección de nuestras piezas en metales nobles.</text><rect x="96.0" y="732" width="400.0" height="346" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><rect x="97.0" y="733" width="398.0" height="166" rx="0" fill="#10171d" stroke="none" stroke-width="1"/><g transform="translate(296.0,816.0) scale(0.6916666666666667)" fill="none" stroke="#f5d77f" stroke-width="3"><ellipse cx="0" cy="20" rx="57" ry="64"/><ellipse cx="0" cy="20" rx="46" ry="55" stroke-width="1"/><path d="M-30,-40 L-18,-58 L18,-58 L30,-40 L0,-8Z" fill="#e8edf1" stroke="#e8edf1"/><path d="M-30,-40 L30,-40 M-18,-58 L0,-8 L18,-58 M-10,-40 L0,-58 L10,-40" stroke="#6c8393" stroke-width="1"/></g><text x="116.0" y="926" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">ORO AMARILLO 18K</text><text x="116.0" y="958" font-family="Liberation Serif" font-size="20" font-weight="600" fill="#f5d77f" text-anchor="start">Solitario Imperial</text><text x="116.0" y="992" font-family="Montserrat" font-size="18" font-weight="600" fill="#edf0f3" text-anchor="start">$ 850.000 ARS</text><rect x="116.0" y="1013" width="360.0" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="296.0" y="1042.0" font-family="Montserrat" font-size="15" font-weight="600" fill="#12181f" text-anchor="middle">Agregá al Carrito</text><rect x="520.0" y="732" width="400.0" height="346" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><rect x="521.0" y="733" width="398.0" height="166" rx="0" fill="#10171d" stroke="none" stroke-width="1"/><g transform="translate(720.0,816.0) scale(0.6916666666666667)" fill="none" stroke="#f5d77f" stroke-width="3"><path d="M-72,-80 Q-70,28 0,53 Q70,28 72,-80"/><path d="M-67,-80 Q-64,23 0,48 Q64,23 67,-80" stroke-width="1"/><path d="M0,48 L22,69 L0,96 L-22,69Z" fill="#d8e5ee" stroke="#d8e5ee"/></g><text x="540.0" y="926" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">PLATINO 950</text><text x="54