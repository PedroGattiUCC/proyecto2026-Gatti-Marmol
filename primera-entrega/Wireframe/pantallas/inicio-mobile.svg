<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3111" viewBox="0 0 390 3111" role="img" aria-labelledby="title desc"><title id="title">Inicio</title><desc id="desc">Mockup digital vectorial de Laure Joyas. Versión móvil de 390 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="390" height="3111" fill="#0b0f12"/><rect x="0" y="0" width="390" height="44" rx="0" fill="#161e27" stroke="none" stroke-width="1"/><text x="16" y="27" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">MOCKUP DIGITAL  /  INICIO</text><text x="24" y="85" font-family="Liberation Serif" font-size="25" font-weight="700" fill="#f5d77f" text-anchor="start">LAURE JOYAS</text><text x="27" y="125" font-family="Montserrat" font-size="13" font-weight="600" fill="#f5d77f" text-anchor="start">Inicio</text><line x1="24" y1="135" x2="114" y2="135" stroke="#f5d77f" stroke-width="2"/><text x="141" y="125" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Catálogo</text><text x="255" y="125" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Cotizador</text><text x="27" y="164" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Contacto</text><text x="141" y="164" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Carrito (2)</text><text x="255" y="164" font-family="Montserrat" font-size="13" font-weight="400" fill="#b0bac5" text-anchor="start">Acceso</text><line x1="0" y1="190" x2="390" y2="190" stroke="#354657" stroke-width="1"/><text x="24" y="234" font-family="Montserrat" font-size="27" font-weight="600" fill="#f5d77f" text-anchor="start">Piezas eternas forjadas a</text><text x="24" y="269" font-family="Montserrat" font-size="27" font-weight="600" fill="#f5d77f" text-anchor="start">mano</text><text x="24" y="328" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Arte orfebre tradicional y gemas de pureza</text><text x="24" y="351" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">inigualable. Cada joya cuenta una historia</text><text x="24" y="374" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">única.</text><rect x="24" y="405" width="342" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="195.0" y="434.0" font-family="Montserrat" font-size="14" font-weight="600" fill="#12181f" text-anchor="middle">Explorá el Catálogo</text><rect x="24" y="465" width="342" height="48" rx="6" fill="#161e27" stroke="#354657" stroke-width="1"/><text x="195.0" y="494.0" font-family="Montserrat" font-size="14" font-weight="600" fill="#edf0f3" text-anchor="middle">Cotizá a Medida</text><rect x="24" y="537" width="342" height="270" rx="0" fill="#10171d" stroke="none" stroke-width="1"/><g transform="translate(195.0,672.0) scale(1.125)" fill="none" stroke="#f5d77f" stroke-width="3"><ellipse cx="0" cy="20" rx="57" ry="64"/><ellipse cx="0" cy="20" rx="46" ry="55" stroke-width="1"/><path d="M-30,-40 L-18,-58 L18,-58 L30,-40 L0,-8Z" fill="#e8edf1" stroke="#e8edf1"/><path d="M-30,-40 L30,-40 M-18,-58 L0,-8 L18,-58 M-10,-40 L0,-58 L10,-40" stroke="#6c8393" stroke-width="1"/></g><text x="40" y="792" font-family="Montserrat" font-size="11" font-weight="400" fill="#b0bac5" text-anchor="start">Colección de anillos y colgantes</text><text x="24" y="863" font-family="Montserrat" font-size="27" font-weight="600" fill="#f5d77f" text-anchor="start">Obras maestras</text><text x="24" y="898" font-family="Montserrat" font-size="27" font-weight="600" fill="#f5d77f" text-anchor="start">destacadas</text><text x="24" y="938" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">Una selección de nuestras piezas en metales</text><text x="24" y="961" font-family="Montserrat" font-size="15" font-weight="400" fill="#b0bac5" text-anchor="start">nobles.</text><rect x="24" y="1008" width="342" height="346" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><rect x="25" y="1009" width="340" height="166" rx="0" fill="#10171d" stroke="none" stroke-width="1"/><g transform="translate(195.0,1092.0) scale(0.6916666666666667)" fill="none" stroke="#f5d77f" stroke-width="3"><ellipse cx="0" cy="20" rx="57" ry="64"/><ellipse cx="0" cy="20" rx="46" ry="55" stroke-width="1"/><path d="M-30,-40 L-18,-58 L18,-58 L30,-40 L0,-8Z" fill="#e8edf1" stroke="#e8edf1"/><path d="M-30,-40 L30,-40 M-18,-58 L0,-8 L18,-58 M-10,-40 L0,-58 L10,-40" stroke="#6c8393" stroke-width="1"/></g><text x="44" y="1202" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">ORO AMARILLO 18K</text><text x="44" y="1234" font-family="Montserrat" font-size="18" font-weight="600" fill="#f5d77f" text-anchor="start">Solitario Imperial</text><text x="44" y="1268" font-family="Montserrat" font-size="18" font-weight="600" fill="#edf0f3" text-anchor="start">$ 850.000 ARS</text><rect x="44" y="1289" width="302" height="48" rx="6" fill="#f5d77f" stroke="#f5d77f" stroke-width="1"/><text x="195.0" y="1318.0" font-family="Montserrat" font-size="14" font-weight="600" fill="#12181f" text-anchor="middle">Agregá al Carrito</text><rect x="24" y="1376" width="342" height="346" rx="10" fill="#161e27" stroke="#354657" stroke-width="1"/><rect x="25" y="1377" width="340" height="166" rx="0" fill="#10171d" stroke="none" stroke-width="1"/><g transform="translate(195.0,1460.0) scale(0.6916666666666667)" fill="none" stroke="#f5d77f" stroke-width="3"><path d="M-72,-80 Q-70,28 0,53 Q70,28 72,-80"/><path d="M-67,-80 Q-64,23 0,48 Q64,23 67,-80" stroke-width="1"/><path d="M0,48 L22,69 L0,96 L-22,69Z" fill="#d8e5ee" stroke="#d8e5ee"/></g><text x="44" y="1570" font-family="Montserrat" font-size="11" font-weight="600" fill="#b0bac5" text-anchor="start">PLATINO