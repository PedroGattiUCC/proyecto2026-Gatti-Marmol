<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1438" viewBox="0 0 390 1438" role="img" aria-labelledby="title desc"><title id="title">Crear cuenta</title><desc id="desc">Boceto digital monocromo de baja fidelidad. Versión móvil de 390 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="390" height="1438" fill="#ffffff"/><rect x="0" y="0" width="390" height="44" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><text x="16" y="27" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">SKETCH DIGITAL  /  CREAR CUENTA</text><text x="24" y="85" font-family="Lato" font-size="25" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="27" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Inicio</text><text x="141" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Catálogo</text><text x="255" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Cotizador</text><text x="27" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Contacto</text><text x="141" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Carrito (2)</text><text x="255" y="164" font-family="Lato" font-size="13" font-weight="600" fill="#181818" text-anchor="start">Acceso</text><line x1="252" y1="174" x2="342" y2="174" stroke="#181818" stroke-width="2"/><line x1="0" y1="190" x2="390" y2="190" stroke="#737373" stroke-width="1"/><text x="24" y="234" font-family="Lato" font-size="27" font-weight="600" fill="#181818" text-anchor="start">Creá tu cuenta</text><text x="24" y="274" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Registrate para iniciar sesión en esta demostración</text><text x="24" y="297" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">académica.</text><rect x="24" y="344" width="342" height="807" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="48" y="388" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Nombre completo</text><rect x="48" y="401" width="294" height="48" rx="2" fill="#ffffff" stroke="#737373" stroke-width="1.4"/><text x="62" y="431" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Ej: Ana García</text><text x="48" y="471" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">2–60 caracteres: letras, espacios, guion o apóstrofo.</text><text x="48" y="515" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Correo electrónico</text><rect x="48" y="528" width="294" height="48" rx="2" fill="#ffffff" stroke="#737373" stroke-width="1.4"/><text x="62" y="558" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">ejemplo@correo.com</text><text x="48" y="598" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Máximo 80 caracteres.</text><text x="48" y="642" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Contraseña</text><rect x="48" y="655" width="294" height="48" rx="2" fill="#ffffff" stroke="#737373" stroke-width="1.4"/><text x="62" y="685" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">••••••••</text><text x="48" y="725" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Entre 8 y 128 caracteres. Usá una clave de prueba.</text><text x="48" y="769" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Confirmá la contraseña</text><rect x="48" y="782" width="294" height="48" rx="2" fill="#ffffff" stroke="#737373" stroke-width="1.4"/><text x="62" y="812" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">••••••••</text><text x="48" y="852" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Ingresá nuevamente la misma contraseña.</text><rect x="48" y="896" width="294" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="925.0" font-family="Lato" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Creá tu cuenta</text><text x="48" y="979" font-family="Lato" font-size="14" font-weight="400" fill="#181818" text-anchor="start">¿Ya tenés cuenta? Iniciá sesión</text><text x="48" y="1023" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Cuenta de demostración almacenada en este</text><text x="48" y="1043" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">navegador. No uses datos sensibles ni una clave de</text><text x="48" y="1063" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">otro servicio.</text><rect x="0" y="1205" width="390" height="233" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><line x1="0" y1="1205" x2="390" y2="1205" stroke="#737373" stroke-width="1"/><text x="24" y="1248" font-family="Lato" font-size="22" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="24" y="1281" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Obispo Trejo 323 · Córdoba, Argentina</text><text x="24" y="1308" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Proyecto académico · Taller de Desarrollo Web · UCC 2026</text><text x="24" y="1335" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Pedro Gatti · Joaquin Mármol</text></svg>