<svg xmlns="http://www.w3.org/2000/svg" width="390" height="4405" viewBox="0 0 390 4405" role="img" aria-labelledby="title desc"><title id="title">Estados y validación</title><desc id="desc">Boceto digital monocromo de baja fidelidad. Versión móvil de 390 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="390" height="4405" fill="#ffffff"/><rect x="0" y="0" width="390" height="44" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><text x="16" y="27" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">SKETCH DIGITAL  /  ESTADOS Y VALIDACIÓN</text><text x="24" y="85" font-family="Lato" font-size="25" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="27" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Inicio</text><text x="141" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Catálogo</text><text x="255" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Cotizador</text><text x="27" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Contacto</text><text x="141" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Carrito (2)</text><text x="255" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Acceso</text><line x1="0" y1="190" x2="390" y2="190" stroke="#737373" stroke-width="1"/><text x="24" y="234" font-family="Lato" font-size="27" font-weight="600" fill="#181818" text-anchor="start">Estados y validación</text><text x="24" y="274" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Variantes de las pantallas. Los mensajes se</text><text x="24" y="297" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">acompañan de texto y acciones claras.</text><rect x="24" y="344" width="342" height="395" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="374" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">01 · COTIZADOR</text><text x="44" y="412" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">Peso fuera de rango</text><text x="44" y="455" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Peso aproximado (gramos)</text><rect x="44" y="468" width="302" height="48" rx="2" fill="#ffffff" stroke="#303030" stroke-width="1.4"/><text x="58" y="498" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Ingresá un peso válido</text><rect x="44" y="535" width="302" height="99" rx="2" fill="#eeeeee" stroke="#303030" stroke-width="1.4"/><text x="56" y="559" font-family="Lato" font-size="12" font-weight="700" fill="#303030" text-anchor="start">Error</text><text x="56" y="583" font-family="Lato" font-size="12" font-weight="400" fill="#303030" text-anchor="start">Ingresá un peso entre 1 y 500 gramos.</text><text x="44" y="657" font-family="Lato" font-size="11" font-weight="400" fill="#505050" text-anchor="start">Alert: campo vacío y foco en peso.</text><rect x="44" y="685" width="302" height="40" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="710.0" font-family="Lato" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Aceptar</text><rect x="24" y="763" width="342" height="395" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="793" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">02 · COTIZADOR</text><text x="44" y="831" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">Gemas inválidas</text><text x="44" y="874" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Cantidad de gemas</text><rect x="44" y="887" width="302" height="48" rx="2" fill="#ffffff" stroke="#303030" stroke-width="1.4"/><text x="58" y="917" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Ingresá una cantidad entera</text><rect x="44" y="954" width="302" height="99" rx="2" fill="#eeeeee" stroke="#303030" stroke-width="1.4"/><text x="56" y="978" font-family="Lato" font-size="12" font-weight="700" fill="#303030" text-anchor="start">Error</text><text x="56" y="1002" font-family="Lato" font-size="12" font-weight="400" fill="#303030" text-anchor="start">La cantidad de gemas debe ser un número entero</text><text x="56" y="1020" font-family="Lato" font-size="12" font-weight="400" fill="#303030" text-anchor="start">entre 0 y 30.</text><text x="44" y="1076" font-family="Lato" font-size="11" font-weight="400" fill="#505050" text-anchor="start">Alert: campo vacío y foco en gemas.</text><rect x="44" y="1104" width="302" height="40" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="1129.0" font-family="Lato" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Aceptar</text><rect x="24" y="1182" width="342" height="395" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="1212" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">03 · CARRITO</text><text x="44" y="1250" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">Cupón inválido</text><text x="44" y="1293" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">¿Tenés un cupón?</text><rect x="44" y="1306" width="302" height="48" rx="2" fill="#ffffff" stroke="#303030" stroke-width="1.4"/><text x="58" y="1336" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Probá: LAURE10</text><rect x="44" y="1373" width="302" height="99" rx="2" fill="#eeeeee" stroke="#303030" stroke-width="1.4"/><text x="56" y="1397" font-family="Lato" font-size="12" font-weight="700" fill="#303030" text-anchor="start">Error</text><text x="56" y="1421" font-family="Lato" font-size="12" font-weight="400" fill="#303030" text-anchor="start">El cupón ingresado no es válido o ha expirado.</text><text x="44" y="1495" font-family="Lato" font-size="11" font-weight="400" fill="#505050" text-anchor="start">Campo vacío, foco y total sin descuento.</text><rect x="44" y="1523" width="302" height="40" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="1548.0" font-family="Lato" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Aplicá</text><rect x="24" y="1601" width="342" height="395" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="1631" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">04 · ACCESO</text><text x="44" y="1669" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">Datos inválidos</text><text x="44" y="1712" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Correo electrónico</text><rect x="44" y="1725" width="302" height="48" rx="2" fill="#ffffff" stroke="#303030" stroke-width="1.4"/><text x="58" y="1755" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">ejemplo@correo.com</text><rect x="44" y="1792" width="302" height="99" rx="2" fill="#eeeeee" stroke="#303030" stroke-width="1.4"/><text x="56" y="1816" font-family="Lato" font-size="12" font-weight="700" fill="#303030" text-anchor="start">Error</text><text x="56" y="1840" font-family="Lato" font-size="12" font-weight="400" fill="#303030" text-anchor="start">Ingresá un correo válido o revisá las credenciales de</text><text x="56" y="1858" font-family="Lato" font-size="12" font-weight="400" fill="#303030" text-anchor="start">tu cuenta.</text><text x="44" y="1914" font-family="Lato" font-size="11" font-weight="400" fill="#505050" text-anchor="start">Panel de error + alert. Corregí el campo.</text><rect x="44" y="1942" width="302" height="40" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="1967.0" font-family="Lato" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Iniciá Sesión</text><rect x="24" y="2020" width="342" height="395" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="2050" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">05 · CREAR CUENTA</text><text x="44" y="2088" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">Contraseñas diferentes</text><text x="44" y="2131" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Confirmá la contraseña</text><rect x="44" y="2144" width="302" height="48" rx="2" fill="#ffffff" stroke="#303030" stroke-width="1.4"/><text x="58" y="2174" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Repetí tu contraseña</text><rect x="44" y="2211" width="302" height="99" rx="2" fill="#eeeeee" stroke="#303030" stroke-width="1.4"/><text x="56" y="2235" font-family="Lato" font-size="12" font-weight="700" fill="#303030" text-anchor="start">Error</text><text x="56" y="2259" font-family="Lato" font-size="12" font-weight="400" fill="#303030" text-anchor="start">Las contraseñas no coinciden. Volvé a ingresarla.</text><text x="44" y="2333" font-family="Lato" font-size="11" font-weight="400" fill="#505050" text-anchor="start">Panel de error + alert. Foco en confirmación.</text><rect x="44" y="2361" width="302" height="40" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="2386.0" font-family="Lato" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Creá tu cuenta</text><rect x="24" y="2439" width="342" height="395" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="2469" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">06 · CREAR CUENTA</text><text x="44" y="2507" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">Correo ya registrado</text><text x="44" y="2550" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="start">Correo electrónico</text><rect x="44" y="2563" width="302" height="48" rx="2" fill="#ffffff" stroke="#303030" stroke-width="1.4"/><text x="58" y="2593" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">ejemplo@correo.com</text><rect x="44" y="2630" width="302" height="99" rx="2" fill="#eeeeee" stroke="#303030" stroke-width="1.4"/><text x="56" y="2654" font-family="Lato" font-size="12" font-weight="700" fill="#303030" text-anchor="start">Error</text><text x="56" y="2678" font-family="Lato" font-size="12" font-weight="400" fill="#303030" text-anchor="start">Este correo ya tiene una cuenta en este navegador.</text><text x="44" y="2752" font-family="Lato" font-size="11" font-weight="400" fill="#505050" text-anchor="start">Revisá el correo o iniciá sesión.</text><rect x="44" y="2780" width="302" height="40" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="2805.0" font-family="Lato" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Ir a Acceso</text><rect x="24" y="2886" width="342" height="284" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="2915" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">07 · CARRITO VACÍO</text><text x="44" y="2953" font-family="Lato" font-size="19" font-weight="600" fill="#181818" text-anchor="start">Tu carrito está vacío</text><text x="44" y="2988" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Agregá productos desde el catálogo antes de</text><text x="44" y="3009" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">confirmar una compra o aplicar un cupón.</text><rect x="44" y="3103" width="302" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="3132.0" font-family="Lato" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Explorá el Catálogo</text><rect x="24" y="3194" width="342" height="284" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="3223" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">08 · CONFIRMAR VACIADO</text><text x="44" y="3261" font-family="Lato" font-size="19" font-weight="600" fill="#181818" text-anchor="start">¿Querés vaciar tu carrito?</text><text x="44" y="3296" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Se quitarán todos los artículos del carrito. Elegí</text><text x="44" y="3317" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Cancelar para conservarlos.</text><rect x="44" y="3411" width="145.0" height="48" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="116.5" y="3440.0" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="middle">Cancelar</text><rect x="201.0" y="3411" width="145.0" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="273.5" y="3440.0" font-family="Lato" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Aceptar</text><rect x="24" y="3502" width="342" height="284" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="3531" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">09 · CUENTA CREADA</text><text x="44" y="3569" font-family="Lato" font-size="19" font-weight="600" fill="#181818" text-anchor="start">Tu cuenta fue creada</text><text x="44" y="3604" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Registro local completado. Ahora podés iniciar sesión</text><text x="44" y="3625" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">con el correo y la contraseña elegidos.</text><rect x="44" y="3719" width="302" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="3748.0" font-family="Lato" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Ir a Acceso</text><rect x="24" y="3810" width="342" height="284" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="44" y="3839" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">10 · SESIÓN ACTIVA</text><text x="44" y="3877" font-family="Lato" font-size="19" font-weight="600" fill="#181818" text-anchor="start">Hola, Ana</text><text x="44" y="3912" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Ana García · ana@ejemplo.com. La sesión de</text><text x="44" y="3933" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">demostración está activa en este navegador.</text><rect x="44" y="4027" width="302" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="4056.0" font-family="Lato" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Salir</text><rect x="0" y="4172" width="390" height="233" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><line x1="0" y1="4172" x2="390" y2="4172" stroke="#737373" stroke-width="1"/><text x="24" y="4215" font-family="Lato" font-size="22" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="24" y="4248" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Obispo Trejo 323 · Córdoba, Argentina</text><text x="24" y="4275" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Proyecto académico · Taller de Desarrollo Web · UCC 2026</text><text x="24" y="4302" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Pedro Gatti · Joaquin Mármol</text></svg>