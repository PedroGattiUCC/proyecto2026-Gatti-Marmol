o</text><rect x="24" y="1663" width="342" height="346" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><rect x="25" y="1664" width="340" height="166" rx="2" fill="#eeeeee" stroke="none" stroke-width="1.4"/><line x1="39" y1="1678" x2="351" y2="1816" stroke="#737373" stroke-width="1"/><line x1="351" y1="1678" x2="39" y2="1816" stroke="#737373" stroke-width="1"/><rect x="45" y="1728.0" width="300" height="40" rx="2" fill="#ffffff" stroke="none" stroke-width="1.4"/><text x="195.0" y="1753.0" font-family="Lato" font-size="13" font-weight="400" fill="#181818" text-anchor="middle">Fotografía de producto</text><text x="44" y="1857" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">ORO BLANCO 18K</text><text x="44" y="1889" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">Aros Royal Brilliance</text><text x="44" y="1923" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">$ 620.000 ARS</text><rect x="44" y="1944" width="302" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="1973.0" font-family="Lato" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Agregá al Carrito</text><text x="24" y="2051" font-family="Lato" font-size="27" font-weight="600" fill="#181818" text-anchor="start">Tarifas de referencia</text><text x="24" y="2110" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Valores por gramo de metal precioso · ARS</text><rect x="24" y="2146" width="342" height="105" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="40" y="2173" font-family="Lato" font-size="16" font-weight="600" fill="#181818" text-anchor="start">Oro 18k</text><text x="40" y="2197" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">750 · Pulido / satinado</text><text x="40" y="2227" font-family="Lato" font-size="17" font-weight="600" fill="#181818" text-anchor="start">$ 95.000 / g</text><rect x="24" y="2263" width="342" height="105" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="40" y="2290" font-family="Lato" font-size="16" font-weight="600" fill="#181818" text-anchor="start">Plata 925</text><text x="40" y="2314" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">925 · Envejecido / rodinado</text><text x="40" y="2344" font-family="Lato" font-size="17" font-weight="600" fill="#181818" text-anchor="start">$ 12.000 / g</text><rect x="24" y="2380" width="342" height="105" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="40" y="2407" font-family="Lato" font-size="16" font-weight="600" fill="#181818" text-anchor="start">Platino 950</text><text x="40" y="2431" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">950 · Brillo de alta durabilidad</text><text x="40" y="2461" font-family="Lato" font-size="17" font-weight="600" fill="#181818" text-anchor="start">$ 110.000 / g</text><rect x="24" y="2523" width="342" height="220" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="46" y="2561" font-family="Lato" font-size="20" font-weight="600" fill="#181818" text-anchor="start">¿Querés una pieza a medida?</text><text x="46" y="2596" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Elegí metal, peso, gemas y grabado para estimar</text><text x="46" y="2618" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">tu joya personalizada.</text><rect x="46" y="2652" width="298" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="2681.0" font-family="Lato" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Cotizá tu Joya Personalizada</text><rect x="0" y="2797" width="390" height="233" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><line x1="0" y1="2797" x2="390