<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3030" viewBox="0 0 390 3030" role="img" aria-labelledby="title desc"><title id="title">Inicio</title><desc id="desc">Boceto digital monocromo de baja fidelidad. Versión móvil de 390 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="390" height="3030" fill="#ffffff"/><rect x="0" y="0" width="390" height="44" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><text x="16" y="27" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">SKETCH DIGITAL  /  INICIO</text><text x="24" y="85" font-family="Lato" font-size="25" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="27" y="125" font-family="Lato" font-size="13" font-weight="600" fill="#181818" text-anchor="start">Inicio</text><line x1="24" y1="135" x2="114" y2="135" stroke="#181818" stroke-width="2"/><text x="141" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Catálogo</text><text x="255" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Cotizador</text><text x="27" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Contacto</text><text x="141" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Carrito (2)</text><text x="255" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Acceso</text><line x1="0" y1="190" x2="390" y2="190" stroke="#737373" stroke-width="1"/><text x="24" y="234" font-family="Lato" font-size="27" font-weight="600" fill="#181818" text-anchor="start">Piezas eternas forjadas a</text><text x="24" y="269" font-family="Lato" font-size="27" font-weight="600" fill="#181818" text-anchor="start">mano</text><text x="24" y="328" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Arte orfebre tradicional y gemas de pureza</text><text x="24" y="351" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">inigualable. Cada joya cuenta una historia única.</text><rect x="24" y="382" width="342" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="195.0" y="411.0" font-family="Lato" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Explorá el Catálogo</text><rect x="24" y="442" width="342" height="48" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="195.0" y="471.0" font-family="Lato" font-size="14" font-weight="600" fill="#181818" text-anchor="middle">Cotizá a Medida</text><rect x="24" y="514" width="342" height="270" rx="2" fill="#eeeeee" stroke="none" stroke-width="1.4"/><line x1="38" y1="528" x2="352" y2="770" stroke="#737373" stroke-width="1"/><line x1="352" y1="528" x2="38" y2="770" stroke="#737373" stroke-width="1"/><rect x="44" y="630.0" width="302" height="40" rx="2" fill="#ffffff" stroke="none" stroke-width="1.4"/><text x="195.0" y="655.0" font-family="Lato" font-size="13" font-weight="400" fill="#181818" text-anchor="middle">Colección de anillos y colgantes</text><text x="24" y="840" font-family="Lato" font-size="27" font-weight="600" fill="#181818" text-anchor="start">Obras maestras destacadas</text><text x="24" y="880" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Una selección de nuestras piezas en metales nobles.</text><rect x="24" y="927" width="342" height="346" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><rect x="25" y="928" width="340" height="166" rx="2" fill="#eeeeee" stroke="none" stroke-width="1.4"/><line x1="39" y1="942" x2="351" y2="1080" stroke="#737373" stroke-width="1"/><line x1="351" y1="942" x2="39" y2="1080" stroke="#737373" stroke-width="1"/><rect x="45" y="992.0" width="300" height="40" rx="2" fill="#ffffff" stroke="none" stroke-width="1.4"/><text x="195.0" y="1017.