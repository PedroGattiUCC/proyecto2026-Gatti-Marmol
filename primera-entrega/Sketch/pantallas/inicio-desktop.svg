737373" stroke-width="1.4"/><text x="120" y="1288" font-family="Lato" font-size="15" font-weight="600" fill="#181818" text-anchor="start">Metal precioso</text><text x="456" y="1288" font-family="Lato" font-size="15" font-weight="600" fill="#181818" text-anchor="start">Pureza / Ley</text><text x="736" y="1288" font-family="Lato" font-size="15" font-weight="600" fill="#181818" text-anchor="start">Valor por gramo</text><text x="1021" y="1288" font-family="Lato" font-size="15" font-weight="600" fill="#181818" text-anchor="start">Acabado disponible</text><line x1="96" y1="1308" x2="1344" y2="1308" stroke="#737373" stroke-width="1"/><text x="120" y="1340" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">Oro 18k</text><text x="456" y="1340" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">18 quilates (750)</text><text x="736" y="1340" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">$ 95.000 ARS</text><text x="1021" y="1340" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">Pulido o satinado</text><line x1="96" y1="1357" x2="1344" y2="1357" stroke="#737373" stroke-width="1"/><text x="120" y="1389" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">Plata 925</text><text x="456" y="1389" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">925 milésimas</text><text x="736" y="1389" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">$ 12.000 ARS</text><text x="1021" y="1389" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">Envejecido o rodinado</text><line x1="96" y1="1406" x2="1344" y2="1406" stroke="#737373" stroke-width="1"/><text x="120" y="1438" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">Platino 950</text><text x="456" y="1438" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">950 milésimas</text><text x="736" y="1438" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">$ 110.000 ARS</text><text x="1021" y="1438" font-family="Lato" font-size="15" font-weight="400" fill="#181818" text-anchor="start">Brillo de alta durabilidad</text><rect x="96" y="1499" width="1248" height="190" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="118" y="1537" font-family="Lato" font-size="28" font-weight="600" fill="#181818" text-anchor="start">¿Querés una pieza a medida?</text><text x="118" y="1572" font-family="Lato" font-size="16" font-weight="400" fill="#505050" text-anchor="start">Elegí metal, peso, gemas y grabado para estimar tu joya personalizada.</text><rect x="118" y="1609" width="310" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="273.0" y="1638.0" font-family="Lato" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Cotizá tu Joya Personalizada</text><rect x="0" y="1743" width="1440" height="170" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><line x1="0" y1="1743" x2="1440" y2="1743" stroke="#737373" stroke-width="1"/><text x="96" y="1786" font-family="Lato" font-size="22" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="96" y="1819" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Obispo Trejo 323 · Córdoba, Argentina</text><text x="96" y="1846" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Proyecto académico · Taller de Desarrollo Web · UCC 2026</text><text x="96" y="1873" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Pedro Gatti · Joaquin Mármol</text></svg>