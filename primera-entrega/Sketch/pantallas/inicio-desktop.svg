<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1913" viewBox="0 0 1440 1913" role="img" aria-labelledby="title desc"><title id="title">Inicio</title><desc id="desc">Boceto digital monocromo de baja fidelidad. Versión escritorio de 1440 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="1440" height="1913" fill="#ffffff"/><rect x="0" y="0" width="1440" height="44" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><text x="32" y="27" font-family="Lato" font-size="13" font-weight="600" fill="#505050" text-anchor="start">SKETCH DIGITAL  /  INICIO</text><text x="64" y="99" font-family="Lato" font-size="30" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="614" y="97" font-family="Lato" font-size="15" font-weight="600" fill="#181818" text-anchor="start">Inicio</text><line x1="614" y1="109" x2="704" y2="109" stroke="#181818" stroke-width="2"/><text x="740" y="97" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Catálogo</text><text x="866" y="97" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Cotizador</text><text x="992" y="97" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Contacto</text><text x="1118" y="97" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Carrito (2)</text><text x="1244" y="97" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Acceso</text><line x1="0" y1="132" x2="1440" y2="132" stroke="#737373" stroke-width="1"/><rect x="96" y="180" width="1248" height="390" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="132" y="226" font-family="Lato" font-size="13" font-weight="600" fill="#505050" text-anchor="start">ALTA JOYERÍA · ORFEBRERÍA FINA</text><text x="132" y="295" font-family="Lato" font-size="48" font-weight="700" fill="#181818" text-anchor="start">Piezas eternas</text><text x="132" y="352" font-family="Lato" font-size="48" font-weight="700" fill="#181818" text-anchor="start">forjadas a mano</text><text x="132" y="400" font-family="Lato" font-size="17" font-weight="400" fill="#505050" text-anchor="start">Arte orfebre tradicional y gemas de pureza inigualable. Cada joya</text><text x="132" y="426" font-family="Lato" font-size="17" font-weight="400" fill="#505050" text-anchor="start">cuenta una historia única.</text><rect x="132" y="490" width="245" height="48" rx="2" fill="#222222" stroke="#222222" stroke-width="1.4"/><text x="254.5" y="519.0" font-family="Lato" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Explorá el Catálogo</text><rect x="391" y="490" width="245" height="48" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="513.5" y="519.0" font-family="Lato" font-size="15" font-weight="600" fill="#181818" text-anchor="middle">Cotizá a Medida</text><rect x="762" y="181" width="581" height="388" rx="2" fill="#eeeeee" stroke="none" stroke-width="1.4"/><line x1="776" y1="195" x2="1329" y2="555" stroke="#737373" stroke-width="1"/><line x1="1329" y1="195" x2="776" y2="555" stroke="#737373" stroke-width="1"/><rect x="782" y="356.0" width="541" height="40" rx="2" fill="#ffffff" stroke="none" stroke-width="1.4"/><text x="1052.5" y="381.0" font-family="Lato" font-size="13" font-weight="400" fill="#181818" text-anchor="middle">Colección de anillos y colgantes</text><text x="96" y="644" font-family="Lato" font-size="38" font-weight="700" fill="#181818" text-anchor="start">Obras maestras destacadas</text><text x="96" y="682" font-family="Lato" font-size="17" font-weight="400" fill="#505050" text-anchor="start">Una selección de nuestras piezas en metales nobles.</text><rect x="96.0" y="732" width="400.0" height="346" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><rect x="97.0" y="733" width="398.0" height="166" rx="2" fill="#eeeeee" stroke="none" stroke-width="1.4"