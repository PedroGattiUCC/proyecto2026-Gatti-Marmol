<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1479" viewBox="0 0 390 1479" role="img" aria-labelledby="title desc"><title id="title">Contacto</title><desc id="desc">Boceto digital monocromo de baja fidelidad. Versión móvil de 390 píxeles. Prototipo de diseño, no captura de la web. Elementos y texto editables.</desc><rect width="390" height="1479" fill="#ffffff"/><rect x="0" y="0" width="390" height="44" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><text x="16" y="27" font-family="Lato" font-size="11" font-weight="600" fill="#505050" text-anchor="start">SKETCH DIGITAL  /  CONTACTO</text><text x="24" y="85" font-family="Lato" font-size="25" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="27" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Inicio</text><text x="141" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Catálogo</text><text x="255" y="125" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Cotizador</text><text x="27" y="164" font-family="Lato" font-size="13" font-weight="600" fill="#181818" text-anchor="start">Contacto</text><line x1="24" y1="174" x2="114" y2="174" stroke="#181818" stroke-width="2"/><text x="141" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Carrito (2)</text><text x="255" y="164" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Acceso</text><line x1="0" y1="190" x2="390" y2="190" stroke="#737373" stroke-width="1"/><text x="24" y="234" font-family="Lato" font-size="27" font-weight="600" fill="#181818" text-anchor="start">Contacto</text><text x="24" y="274" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">Conocé la ubicación y los datos del equipo de este</text><text x="24" y="297" font-family="Lato" font-size="15" font-weight="400" fill="#505050" text-anchor="start">proyecto académico.</text><rect x="24" y="344" width="342" height="249" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="48" y="386" font-family="Lato" font-size="20" font-weight="600" fill="#181818" text-anchor="start">Ubicación de referencia</text><text x="48" y="432" font-family="Lato" font-size="18" font-weight="600" fill="#181818" text-anchor="start">Obispo Trejo 323</text><text x="48" y="470" font-family="Lato" font-size="16" font-weight="400" fill="#505050" text-anchor="start">Córdoba, Argentina</text><text x="48" y="517" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Alta Joyería y Orfebrería Fina · Laure Joyas</text><rect x="24" y="621" width="342" height="346" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="48" y="663" font-family="Lato" font-size="20" font-weight="600" fill="#181818" text-anchor="start">Equipo académico</text><text x="48" y="707" font-family="Lato" font-size="17" font-weight="600" fill="#181818" text-anchor="start">Pedro Gatti</text><text x="48" y="738" font-family="Lato" font-size="14" font-weight="400" fill="#181818" text-anchor="start">2519717@ucc.edu.ar</text><line x1="48" y1="768" x2="342" y2="768" stroke="#737373" stroke-width="1"/><text x="48" y="804" font-family="Lato" font-size="17" font-weight="600" fill="#181818" text-anchor="start">Joaquin Mármol</text><text x="48" y="835" font-family="Lato" font-size="14" font-weight="400" fill="#181818" text-anchor="start">2514908@ucc.edu.ar</text><text x="48" y="880" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">Los correos abren tu aplicación de email. Proyecto</text><text x="48" y="900" font-family="Lato" font-size="13" font-weight="400" fill="#505050" text-anchor="start">de Taller de Desarrollo Web · UCC 2026.</text><rect x="24" y="1012" width="342" height="180" rx="2" fill="#f8f8f8" stroke="#737373" stroke-width="1.4"/><text x="46" y="1047" font-family="Lato" font-size="20" font-weight="600" fill="#181818" text-anchor="start">Sobre este sitio</text><text x="46" y="1080" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Laure Joyas es una demostración académica.</text><text x="46" y="1102" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">Estos datos identifican a los autores del</text><text x="46" y="1124" font-family="Lato" font-size="14" font-weight="400" fill="#505050" text-anchor="start">proyecto.</text><rect x="0" y="1246" width="390" height="233" rx="2" fill="#f8f8f8" stroke="none" stroke-width="1.4"/><line x1="0" y1="1246" x2="390" y2="1246" stroke="#737373" stroke-width="1"/><text x="24" y="1289" font-family="Lato" font-size="22" font-weight="700" fill="#181818" text-anchor="start">LAURE JOYAS</text><text x="24" y="1322" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Obispo Trejo 323 · Córdoba, Argentina</text><text x="24" y="1349" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Proyecto académico · Taller de Desarrollo Web · UCC 2026</text><text x="24" y="1376" font-family="Lato" font-size="12" font-weight="400" fill="#505050" text-anchor="start">Pedro Gatti · Joaquin Mármol</text></svg>